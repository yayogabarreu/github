<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba en CSS</title> 
    <style>
        .verde {
            color: green;
            font-family: "Courier New";
        }
        .azul {
            color: blue;
        }
        .amarillo {
            color: rgb(240, 240, 30);
        }
        p {
            font-family: sans-serif;
            font-size: 2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="azul">Empezando con CSS</h1>
    <p class="verde">Este es un parrafo verde</p>
    <p class="azul">Este es un parrafo azul</p>
    <p class="amarillo">Este es un parrafo amarillo</p>

    <div style="border: 2px dotted red; padding: 50px; margin: 50px;">Primer bloque</div>
    <div style="border: 5px dashed green; padding-top: 100px; margin-top: 100px;">Segundo bloque</div>



</body>
</html>
