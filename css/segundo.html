<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo CSS</title>
    <style>
        ul.menu > li {
            color: red;
            font-family: "Tahoma";
        }
        h2 + p {
            color: green;
        }   
        input[type="text"] {
            border: 3px solid red;
        }
        p.azul {
            color: blue;
        }
        p.azul::first-letter {
            font-size: 3em;
        }
        p.verde:hover {
            color: green;
            font-size: 10em;
            background-image: url(img/jamone.jpg);
        }
        input:focus {
            border: 5px red dashed;
        }
        tr:nth-child(even) {
            background-color: orangered;
        }
        .bloque {
            width: 40%;
            height: 60%;
            border: 1px solid red;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <li>Primera Opción</li>
        <ul>
            <li>Subopción 1</li>
            <li>Subopción 2</li>
        </ul>
        <li>Segunda Opción</li>
    </ul>

        <p>Mi primer párrafo</p>

        <h2>Esto es un encabezado de segundo nivel</h2>
        <p>Mi segundo párrafo</p>
        
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Escribe algo aquí" required>
            <label for="edad">Edad:</label>
            <input type="number" step="5" id="edad" placeholder="Escribe tu edad aquí" required>
            <input type="submit" value="Enviar">
        </form>

            <p class="verde">Este es un parrafo verde</p>
            <p class="azul">Este es un parrafo azul</p>

        <table>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
            </tr>
            <tr>
                <td>Juan</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>28</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>22</td>
        </table>

        <div class="bloque">
            <p>La mami</p>
            <img src="img/jamone.jpg" alt="Imagen de jamón" width="200" style="display: block; margin: 0 auto;">
        </div>

</body>
</html>
