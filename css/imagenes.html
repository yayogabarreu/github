<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrado de imagenes</title>
    <style>
        img {
            display: block;
            margin: 0 auto;
            width: 300px;
            border-radius: 20px;
        }
        .jamones {
            position: CENTER; 
            right:auto;
            bottom: auto;
        }
        .puas {
            position: absolute; 
            top: auto;
            left: auto;
        }
        .salchichon {
            position: fixed;
            right: 20px;
            bottom: 300px;
        }
    </style>
</head>
<body>
    <h1>Centrado de imagenes</h1>
    <img class="jamones" src="img/jamone.jpg" alt="Imagen del jamones">
    <img class="puas" src="img/PUAS-1.jpg" alt="Imagen del puas">
    <img class="salchichon" src="img/salchichon.jpeg" alt="Imagen de perro salchicha">
</body>
</html>
